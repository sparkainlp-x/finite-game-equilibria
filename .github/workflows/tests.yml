name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt && python -m pip install .
      - name: pytest (warnings are errors)
        run: python -W error -m pytest -q
      - name: CLI demos
        run: |
          python -W error -m finite_game_equilibria
          python -W error -m finite_game_equilibria --game matching-pennies
          python -W error -m finite_game_equilibria --game coordination
          finite-game-equilibria --game prisoners-dilemma --epsilon 2
